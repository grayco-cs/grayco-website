<script>
/* Contact form -> GrayCo CRM (Leads -> Lead Inbox). If the CRM cannot be reached, the old e-mail fallback opens. */
(function(){
  var URL='https://crm.grayco-cs.com/.netlify/functions/website-intake', tok='', got=0;
  function getTok(){ return fetch(URL+'?form=1',{cache:'no-store'}).then(function(r){return r.json();}).then(function(j){ if(j&&j.token){tok=j.token;got=Date.now();} }).catch(function(){}); }
  getTok();
  function note(msg,ok){ var t=document.createElement('div'); t.innerText=msg; t.style.cssText='position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:'+(ok?'#1f7a3a':'#8a1c1c')+';color:#fff;padding:12px 24px;border-radius:8px;font-family:sans-serif;font-size:15px;z-index:99999;box-shadow:0 2px 8px rgba(0,0,0,.3);max-width:90vw;text-align:center'; document.body.appendChild(t); setTimeout(function(){t.remove();},8000); }
  window.gcLead=function(r,files,fallback){
    r=r||{}; var n=(files&&files.length)||0;
    var send=function(){
      if(Date.now()-got>20*3600000||!tok) return getTok().then(post);
      var wait=Math.max(0,3500-(Date.now()-got)); return new Promise(function(res){setTimeout(res,wait);}).then(post);
    };
    var post=function(){
      return fetch(URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({
        name:r.name||'', email:r.email||'', phone:r.phone||'', type:r.projectType||'', service:r.projectType||'',
        message:(r.message||'')+(n?'\n\n['+n+' photo(s) picked on the website - ask the customer to e-mail them]':''),
        token:tok, page:location.href, via:'grayco-website contact form'})})
      .then(function(x){ return x.json().catch(function(){return {};}).then(function(j){ return {ok:x.ok&&j.ok,j:j}; }); });
    };
    send().then(function(res){
      if(res.ok){ note('Thank you! We got your message and will reach out soon.',true); return; }
      fallback();
    }).catch(function(){ fallback(); });
  };
})();
</script>
<div id="root"></div>
<script>
(async function(){
  var KEY='grayco-site-content-v3';
  var GET_FN='/.netlify/functions/get-content';
  var SAVE_FN='/.netlify/functions/save-content';

  // ── FIX: redirect Cloudinary uploads to the correct account ──────────────
  // The built app has the wrong cloud name baked in ('grayco'); rewrite it
  // to the real one ('dzewujlvg') so photos upload to the cloud instead of
  // filling up browser storage.
  var _origFetch = window.fetch;
  window.fetch = function(url, opts){
    try{
      if (typeof url === 'string' && url.indexOf('cloudinary.com/v1_1/grayco/') !== -1){
        url = url.replace('cloudinary.com/v1_1/grayco/', 'cloudinary.com/v1_1/dzewujlvg/');
      }
    }catch(e){}
    return _origFetch.call(this, url, opts);
  };

  function toast(msg,color){
    var t=document.createElement('div');
    t.innerText=msg;
    t.style.cssText='position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:'+color+';color:#fff;padding:10px 24px;border-radius:8px;font-family:sans-serif;font-size:14px;z-index:99999;box-shadow:0 2px 8px rgba(0,0,0,0.3);max-width:90vw;text-align:center';
    document.body.appendChild(t);
    setTimeout(function(){t.remove();},6000);
  }

  // Load latest content via Netlify function (bypasses all caching)
  try{
    var res=await _origFetch(GET_FN,{cache:'no-store'});
    if(res.ok){
      var text=await res.text();
      try{
        var p=JSON.parse(text);
        if(p&&Object.keys(p).length>1){
          localStorage.setItem(KEY,text);
        }
      }catch(e){}
    }
  }catch(e){console.warn('[GrayCo] Cloud load failed:',e.message);}

  // Intercept saves to also push to cloud
  var _origSetItem=Storage.prototype.setItem;
  Storage.prototype.setItem=function(k,v){
    _origSetItem.call(this,k,v);
    if(k===KEY){
      _origFetch(SAVE_FN,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({content:v})})
      .then(async function(r){
        var data={};
        try{data=await r.json();}catch(e){}
        if(r.ok&&data.ok){
          toast('☁️ Saved to cloud!','#2e7d32');
        }else{
          var reason=data.reason||data.error||('HTTP '+r.status);
          toast('❌ Cloud error: '+reason,'#c62828');
        }
      }).catch(function(e){toast('❌ Network error: '+e.message,'#c62828');});
    }
  };

  // Start the app
  var s=document.createElement('script');
  s.type='module';
  s.src='./assets/index-5ObGMj_N.js';
  document.body.appendChild(s);
})();
</script>
</body>
